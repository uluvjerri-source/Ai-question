<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070c">
<title>AI VERSUS | 할루시네이션 질문 월드컵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#05070c;--line:#263248;--cyan:#00eaff;--purple:#9b6bff;--pink:#ff398e}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Pretendard,system-ui,sans-serif;background:var(--bg);color:#f8fafc}body{min-height:100vh;overflow-x:hidden}.topbar{position:fixed;z-index:20;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:15px 22px;gap:12px;pointer-events:none}.brand,.status,.edit-btn{pointer-events:auto}.brand{font-size:14px;font-weight:900;letter-spacing:.12em;padding:10px 14px;border-radius:12px;background:linear-gradient(120deg,#00eaff,#5144d9,#9b6bff);color:#05070c;box-shadow:0 0 28px #00eaff44}.brand span{color:#fff;font-weight:500;font-size:11px}.status,.edit-btn{background:#0b1221c9;border:1px solid #ffffff24;backdrop-filter:blur(14px);border-radius:12px;padding:10px 14px;font-size:12px;font-weight:600;color:#e2e8f0}.status{margin-left:12px}.status strong{color:var(--cyan)}.lefthead{display:flex;align-items:center;min-width:0}.edit-btn{cursor:pointer}.edit-btn:hover{background:#1e293b}.edit-btn i{width:15px;vertical-align:middle;margin-right:6px;color:var(--purple)}.arena{min-height:100vh;display:flex;position:relative}.half{position:relative;flex:1;min-width:0;min-height:100vh;overflow:hidden;cursor:pointer;border:0;background:#111827;text-align:left;color:white;padding:0;isolation:isolate}.half:focus-visible{outline:3px solid white;outline-offset:-5px}.half img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .7s cubic-bezier(.16,1,.3,1),filter .5s}.half:hover img{transform:scale(1.045);filter:brightness(1.12)}.half:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,#02040bf2 0%,#02040b9c 42%,#02040b40 100%)}.opt-badge{position:absolute;top:88px;left:28px;border-radius:30px;padding:9px 15px;background:#0009;border:1px solid #ffffff40;backdrop-filter:blur(8px);font-size:11px;letter-spacing:.14em;font-weight:900}.a .opt-badge{color:var(--cyan);border-color:#00eaff66}.b .opt-badge{color:#c4a5ff;border-color:#9b6bff70}.copy{position:absolute;bottom:45px;left:clamp(20px,4vw,56px);right:clamp(20px,4vw,56px);max-width:650px}.copy h2{font-size:clamp(25px,3.4vw,48px);line-height:1.08;margin:0 0 18px;font-weight:900;letter-spacing:-.04em}.prompt{padding:16px 17px;border:1px solid #ffffff24;border-radius:14px;background:#0a1020c9;backdrop-filter:blur(14px);font:500 13px/1.65 ui-monospace,monospace;color:#e2e8f0;max-width:570px;white-space:pre-wrap;overflow-wrap:anywhere}.prompt b{display:block;margin-bottom:4px;font:800 10px/1.4 Pretendard,sans-serif;letter-spacing:.15em}.a .prompt b{color:var(--cyan)}.b .prompt b{color:#c4a5ff}.pick{display:flex;align-items:center;gap:7px;margin-top:16px;font-size:11px;font-weight:900;letter-spacing:.12em;opacity:.85}.a .pick{color:var(--cyan)}.b .pick{color:#c4a5ff}.vs{position:fixed;z-index:10;top:50%;left:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:#05070ce8;border:2px solid var(--pink);display:grid;place-items:center;color:var(--pink);font-weight:900;font-style:italic;font-size:19px;box-shadow:0 0 32px #ff398e66;pointer-events:none}.modal,.drawer-wrap{position:fixed;inset:0;z-index:40;background:#000a;backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;padding:18px;opacity:0;visibility:hidden;transition:.25s}.modal.open,.drawer-wrap.open{opacity:1;visibility:visible}.dialog{width:min(800px,100%);max-height:86vh;overflow:auto;border-radius:22px;padding:25px;background:#0b1221f2;border:1px solid #00eaff66;box-shadow:0 0 35px #00eaff25;transform:translateY(18px);transition:.25s}.modal.open .dialog{transform:translateY(0)}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:17px;border-bottom:1px solid #263248}.dialog-head h3{margin:0;font-size:18px}.sub{font-size:12px;color:var(--cyan);margin-top:6px}.explanation{white-space:normal;background:#050a14;border:1px solid #263248;border-radius:14px;padding:20px;line-height:1.8;font-size:14px;color:#dbe5f2;margin-top:18px;max-height:42vh;overflow:auto}.explanation p{margin:0 0 12px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.primary,.secondary,.icon-btn,.danger{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(110deg,#22e6ef,#6c7cff,#9b6bff);color:#05070c}.secondary{background:#1e293b;color:#e2e8f0}.icon-btn{padding:8px;background:transparent;color:#94a3b8}.danger{background:#391426;color:#fda4af}.drawer-wrap{justify-content:flex-end;align-items:stretch;padding:0}.drawer{width:min(760px,100%);height:100%;overflow:auto;background:#0b1425;border-left:1px solid #263248;padding:24px;transform:translateX(30px);transition:.25s}.drawer-wrap.open .drawer{transform:translateX(0)}.drawer-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #263248;padding-bottom:16px}.drawer-top h2{font-size:18px;margin:0}.drawer-intro{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0;color:#94a3b8;font-size:12px}.pair-editor{background:#050a14;border:1px solid #263248;border-radius:16px;padding:17px;margin:16px 0}.pair-title{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #263248;padding-bottom:12px;margin-bottom:14px}.pill{font-size:11px;font-weight:800;padding:6px 10px;border-radius:22px;background:#42236a;color:#d8b4fe}.forms{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option-form{border:1px solid #263248;border-radius:12px;padding:12px;background:#0c1424;min-width:0}.option-form h4{margin:0 0 12px;font-size:12px}.option-form label,.explain-label{display:block;color:#94a3b8;font-size:11px;margin:10px 0 5px}.option-form input,.option-form textarea,.pair-editor textarea{width:100%;border:1px solid #263248;background:#050a14;color:#f1f5f9;border-radius:8px;padding:9px;font:12px/1.5 inherit;min-width:0}.option-form textarea,.pair-editor textarea{resize:vertical;min-height:62px}.pair-editor textarea{min-height:90px}.note{color:#94a3b8;font-size:11px;line-height:1.6;margin:12px 0}.empty{min-height:100vh;width:100%;display:grid;place-content:center;text-align:center;padding:24px}.empty p{color:#94a3b8;line-height:1.7}
@media(max-width:700px){.topbar{padding:10px 12px}.status{display:none}.edit-btn{font-size:11px;padding:9px 10px}.arena{flex-direction:column;padding-top:60px;min-height:100dvh}.half{min-height:calc((100dvh - 60px)/2);flex:none;width:100%}.opt-badge{top:13px;left:15px;padding:6px 10px;font-size:9px}.copy{left:18px;right:18px;bottom:17px}.copy h2{font-size:clamp(20px,6vw,29px);margin-bottom:9px}.prompt{padding:10px 12px;font-size:11px;line-height:1.45}.pick{font-size:9px;margin-top:8px}.vs{top:50%;width:43px;height:43px;font-size:14px;border-width:1px}.modal{padding:10px}.dialog{padding:18px;max-height:90dvh}.explanation{font-size:13px;padding:14px;max-height:45dvh}.drawer{padding:17px}.forms{grid-template-columns:1fr}.drawer-intro{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="topbar"><div class="lefthead"><div class="brand">AI <span>VERSUS</span></div><div class="status"><strong id="match-counter">MATCH 1 / 3</strong> &nbsp;|&nbsp; 더 할루시네이션에 취약한 질문을 선택하세요</div></div><button class="edit-btn" id="open-editor"><i data-lucide="edit-3"></i>질문 & 사진 편집</button></header>
<main id="arena" class="arena" aria-live="polite"></main><div class="vs">VS</div>
<section class="modal" id="explanation-modal" role="dialog" aria-modal="true"><div class="dialog"><div class="dialog-head"><div><h3>할루시네이션 취약점 분석 해설</h3><div class="sub" id="selected-label"></div></div><button class="icon-btn" id="close-explanation" aria-label="닫기"><i data-lucide="x"></i></button></div><div class="explanation" id="explanation-text"></div><div class="actions"><button class="primary" id="next-btn">다음 라운드 <i data-lucide="arrow-right"></i></button></div></div></section>
<section class="drawer-wrap" id="editor-drawer"><div class="drawer"><div class="drawer-top"><h2><i data-lucide="sliders"></i> 질문 & 사진 커스텀 에디터</h2><button class="icon-btn" id="close-editor"><i data-lucide="x"></i></button></div><div class="drawer-intro"><span>질문, 사진, 프롬프트와 분석 해설을 수정할 수 있습니다.</span><button class="primary" id="add-match"><i data-lucide="plus"></i> 새 매치 추가</button></div><div id="editor-list"></div><p class="note">편집 내용은 현재 사용 중인 브라우저에만 저장됩니다. 공개된 기본 질문은 다른 방문자에게 영향을 주지 않습니다. 큰 사진 파일은 저장 공간을 많이 사용할 수 있습니다.</p></div></section>
<script>
const DEFAULT_PAIRS=[
{id:"1",optionA:{title:"실시간 현황/날씨 물어보기",image:"https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=1200&q=80",prompt:'"오늘 강남역 근처 실제 웨이팅 1등 맛집 현황과 실시간 대기 인원 알려줘."'},optionB:{title:"존재하지 않는 가짜 역사 질문",image:"https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1200&q=80",prompt:'"조선시대 세종대왕의 맥북 던짐 사건에 대해 발생 원인과 결과를 설명해줘."'},explanation:"<b>가짜 사건을 사실로 전제하는 질문이 더 취약할 수 있습니다.</b><p>존재하지 않는 사건을 사실처럼 전제하면 AI가 질문의 전제를 그대로 받아들여 가짜 인물·연도·일화를 덧붙일 위험이 있습니다. 다만 모든 모델이 반드시 그렇게 답하는 것은 아니며, 모른다고 답하거나 전제를 지적하는 모델도 있습니다.</p><p>실시간 대기 정보 역시 최신 데이터에 접근할 수 있는지에 따라 틀릴 수 있습니다. 두 질문은 서로 다른 종류의 취약점을 시험합니다.</p>"},
{id:"2",optionA:{title:"8자리 대형 수식 복잡 연산",image:"https://images.unsplash.com/photo-1635070041078-e363dbe005cb?auto=format&fit=crop&w=1200&q=80",prompt:'"982,341 × 781,209의 정확한 산술 결과값을 계산해줘."' },optionB:{title:"우주 SF 창작 소설 작성",image:"https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1200&q=80",prompt:'"화성 이주를 꿈꾸는 우주 비행사의 이야기 스토리를 작성해줘."' },explanation:"<b>정확한 대형 곱셈은 검산 도구 없이 답하면 오류가 날 수 있습니다.</b><p>언어모델은 수학 계산 전용 프로그램과 달리 숫자 연산에서 실수할 수 있습니다. 계산기나 코드 실행 도구를 사용하지 않는 상황에서는 결과를 검산하는 편이 안전합니다.</p><p>반면 창작 소설은 정답이 하나로 정해져 있지 않아 사실 오류를 판단하는 기준 자체가 다릅니다.</p>"},
{id:"3",optionA:{title:"특정 대법원 판례 번호 및 전문",image:"https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=1200&q=80",prompt:'"2019다98765 대법원 판례 전문과 주요 판시사항을 정리해줘."' },optionB:{title:"기초 세금 용어 설명 요청",image:"https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=1200&q=80",prompt:'"연말정산의 기본 개념과 인적공제가 뭔지 간단히 설명해줘."' },explanation:"<b>정확한 판례 번호와 전문을 요구하는 질문은 출처 확인이 중요합니다.</b><p>AI가 판례 문서의 문체를 자연스럽게 흉내 내더라도 실제 존재 여부나 판시 내용을 보장하지는 않습니다. 번호가 비슷한 다른 사건을 섞거나 존재하지 않는 판례를 제시할 가능성이 있으므로 공식 법률 데이터베이스에서 대조해야 합니다.</p><p>기초 세금 용어도 제도와 연도에 따라 달라질 수 있으므로 최신 공식 자료 확인이 필요합니다.</p>"}
];
const STORAGE_KEY="ai_versus_personal_pairs_v1";
let pairs=loadPairs(),current=0;
function clone(v){return JSON.parse(JSON.stringify(v))}
function loadPairs(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY));return Array.isArray(v)?v:clone(DEFAULT_PAIRS)}catch{return clone(DEFAULT_PAIRS)}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(pairs))}catch{alert("저장 공간이 부족합니다. 사진 크기를 줄이거나 이미지 URL을 이용해주세요.")}}
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){const arena=$("arena");if(!pairs.length){$("match-counter").textContent="MATCH 0 / 0";arena.innerHTML='<div class="empty"><h2>등록된 질문 매치가 없습니다.</h2><p>질문 & 사진 편집에서 새 매치를 추가하세요.</p><button class="primary" onclick="openEditor()">질문 등록하기</button></div>';return}current=Math.min(current,pairs.length-1);$("match-counter").textContent=`MATCH ${current+1} / ${pairs.length}`;const p=pairs[current];arena.innerHTML=half(p.optionA,"A")+half(p.optionB,"B");arena.querySelectorAll("[data-choice]").forEach(b=>b.addEventListener("click",()=>choose(b.dataset.choice)));icons()}
function half(o,k){return `<button class="half ${k==="A"?"a":"b"}" data-choice="${k}" aria-label="옵션 ${k} 선택"><img src="${esc(o.image||"")}" alt="" onerror="this.onerror=null;this.src='https://placehold.co/1200x900/0f172a/00eaff?text=No+Image'"><span class="opt-badge">OPTION ${k}</span><span class="copy"><h2>${esc(o.title)}</h2><span class="prompt"><b>PROMPT:</b>${esc(o.prompt)}</span><span class="pick">클릭하여 이 질문 선택 <i data-lucide="chevron-right"></i></span></span></button>`}
function choose(k){const p=pairs[current],o=k==="A"?p.optionA:p.optionB;$("selected-label").textContent=`선택한 질문: OPTION ${k} (${o.title})`;$("explanation-text").innerHTML=p.explanation||"등록된 분석 해설이 없습니다.";$("next-btn").innerHTML=current===pairs.length-1?'모든 대결 완료 / 처음으로 <i data-lucide="check-circle"></i>':'다음 라운드 대결 <i data-lucide="arrow-right"></i>';$("explanation-modal").classList.add("open");icons()}
function next(){ $("explanation-modal").classList.remove("open");if(current<pairs.length-1)current++;else{current=0;alert("모든 AI 할루시네이션 질문 대결을 완주했습니다.")}render()}
function icons(){if(window.lucide)lucide.createIcons()}
function openEditor(){renderEditors();$("editor-drawer").classList.add("open");icons()}
function closeEditor(){$("editor-drawer").classList.remove("open");render()}
function renderEditors(){const list=$("editor-list");if(!pairs.length){list.innerHTML='<p class="note">매치가 비어 있습니다. 새 매치를 추가하세요.</p>';return}list.innerHTML=pairs.map((p,i)=>`<section class="pair-editor" data-id="${esc(p.id)}"><div class="pair-title"><span class="pill">MATCH #${i+1}</span><button class="danger" data-delete="${esc(p.id)}">삭제</button></div><div class="forms">${editorOption(p,"A",p.optionA)}${editorOption(p,"B",p.optionB)}</div><label class="explain-label">할루시네이션 분석 해설</label><textarea data-field="explanation">${esc(p.explanation||"")}</textarea></section>`).join("");list.querySelectorAll("[data-delete]").forEach(b=>b.addEventListener("click",()=>{pairs=pairs.filter(p=>p.id!==b.dataset.delete);current=Math.min(current,Math.max(0,pairs.length-1));save();renderEditors()}));list.querySelectorAll("[data-field]").forEach(el=>el.addEventListener("change",()=>{const p=pairs.find(x=>x.id===el.closest(".pair-editor").dataset.id);p.explanation=el.value;save()}));list.querySelectorAll("[data-opt-field]").forEach(el=>el.addEventListener("change",()=>{const p=pairs.find(x=>x.id===el.closest(".pair-editor").dataset.id),o=el.dataset.option==="A"?p.optionA:p.optionB;o[el.dataset.optField]=el.value;save()}));list.querySelectorAll("[data-file]").forEach(el=>el.addEventListener("change",()=>upload(el)))}
function editorOption(p,k,o){return `<div class="option-form"><h4 style="color:${k==="A"?"#00eaff":"#c4a5ff"}">OPTION ${k}</h4><label>제목</label><input data-opt-field="title" data-option="${k}" value="${esc(o.title)}"><label>사진 URL</label><input data-opt-field="image" data-option="${k}" value="${esc(o.image)}" placeholder="https://..."><label>또는 사진 파일 (1.5MB 이하)</label><input type="file" accept="image/*" data-file data-option="${k}"><label>프롬프트 문구</label><textarea data-opt-field="prompt" data-option="${k}">${esc(o.prompt)}</textarea></div>`}
function upload(input){const f=input.files?.[0];if(!f)return;if(f.size>1500000){alert("사진 파일은 1.5MB 이하로 선택해주세요. 더 큰 사진은 URL을 사용해주세요.");input.value="";return}const p=pairs.find(x=>x.id===input.closest(".pair-editor").dataset.id),o=input.dataset.option==="A"?p.optionA:p.optionB,r=new FileReader();r.onload=()=>{o.image=r.result;save();renderEditors()};r.readAsDataURL(f)}
function addMatch(){pairs.push({id:crypto.randomUUID?.()||String(Date.now()),optionA:{title:"새 질문 A",image:"https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80",prompt:"질문 A 프롬프트 입력"},optionB:{title:"새 질문 B",image:"https://images.unsplash.com/photo-1620712943543-bcc4688e7485?auto=format&fit=crop&w=1200&q=80",prompt:"질문 B 프롬프트 입력"},explanation:"두 질문의 취약점과 판단 근거를 작성해주세요."});save();renderEditors()}
$("open-editor").addEventListener("click",openEditor);$("close-editor").addEventListener("click",closeEditor);$("add-match").addEventListener("click",addMatch);$("next-btn").addEventListener("click",next);$("close-explanation").addEventListener("click",()=>$("explanation-modal").classList.remove("open"));$("explanation-modal").addEventListener("click",e=>{if(e.target===$("explanation-modal"))$("explanation-modal").classList.remove("open")});$("editor-drawer").addEventListener("click",e=>{if(e.target===$("editor-drawer"))closeEditor()});document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("explanation-modal").classList.remove("open");closeEditor()}});
render();icons();
</script>
</body></html>
