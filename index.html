und:repeating-conic-gradient(from -8deg at 50% 50%,#ffffff00 0deg 7deg,#ffffffd9 7.2deg 7.8deg,#00eaff99 8deg 8.5deg,#ffffff00 9deg 15deg,#ff398e99 15.5deg 16deg,#ffffff00 17deg 24deg),radial-gradient(circle at center,#ffffff 0%,#00eaff99 4%,#ff398e44 14%,transparent 40%);mix-blend-mode:screen;clip-path:polygon(50% 0%,57% 35%,100% 10%,65% 46%,98% 85%,57% 60%,50% 100%,43% 60%,2% 85%,35% 46%,0% 10%,43% 35%)}.reveal-modal.open .fracture-overlay{animation:fracture-hit 1.05s cubic-bezier(.12,.75,.18,1) both}.reveal-card{position:relative;text-align:center;width:min(760px,94vw);padding:clamp(38px,7vh,72px) 28px;border:1px solid #ffffff55;border-radius:26px;background:radial-gradient(circle at 50% 0%,#27345b 0%,#0b1221 65%);box-shadow:0 0 70px #9b6bff55,0 0 150px #00eaff22;overflow:visible;transform:scale(.35);opacity:0;z-index:2}.reveal-modal.open .reveal-card{animation:reveal-pop .72s cubic-bezier(.12,1.5,.25,1) forwards}.reveal-burst{position:absolute;z-index:-1;inset:-42vmax;border-radius:50%;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 50%,#ffffff00 0deg 5deg,#ffffffaa 5.5deg 6deg,#00eaff55 7deg 8deg,#ffffff00 10deg 15deg,#ff398e55 16deg 17deg,#ffffff00 20deg 25deg);mask-image:radial-gradient(circle,#000 0%,#000 16%,transparent 62%);opacity:0}.reveal-modal.open .reveal-burst{animation:burst-spin .95s cubic-bezier(.12,.8,.2,1) both}.reveal-card:before,.reveal-card:after{content:"";position:absolute;z-index:-1;left:50%;top:43%;width:70px;height:70px;border:5px solid var(--cyan);border-radius:50%;transform:translate(-50%,-50%) scale(.1);opacity:0;pointer-events:none}.reveal-card:before{box-shadow:0 0 25px var(--cyan),inset 0 0 20px var(--cyan)}.reveal-card:after{border-color:#ff398e;box-shadow:0 0 25px #ff398e;animation-delay:.12s}.reveal-modal.open .reveal-card:before{animation:shockwave .9s .03s ease-out both}.reveal-modal.open .reveal-card:after{animation:shockwave .9s .15s ease-out both}.reveal-stamp{position:relative;display:inline-grid;place-items:center;width:clamp(130px,24vw,190px);height:clamp(130px,24vw,190px);border-radius:50%;border:4px solid var(--cyan);color:var(--cyan);font-size:48px;font-weight:1000;background:#06121ddd;box-shadow:0 0 35px #00eaffaa,0 0 90px #00eaff66,inset 0 0 28px #00eaff44;margin-bottom:20px;animation:stamp-hit .72s .08s cubic-bezier(.16,1.7,.3,1) both}.reveal-modal.wrong .reveal-stamp{border-color:var(--pink);color:var(--pink);box-shadow:0 0 35px #ff398eaa,0 0 90px #ff398e66,inset 0 0 28px #ff398e44}.reveal-kicker{position:relative;font-size:11px;font-weight:900;letter-spacing:.24em;color:#a5b4fc}.reveal-title{position:relative;font-size:clamp(52px,12vw,92px);font-weight:1000;letter-spacing:-.06em;margin:12px 0}.reveal-modal.correct .reveal-title{color:var(--cyan);text-shadow:0 0 24px #00eaff66,0 0 55px #00eaff88}.reveal-modal.wrong .reveal-title{color:#ff6aa8;text-shadow:0 0 24px #ff398e66}.reveal-detail{position:relative;color:#cbd5e1;font-size:14px;line-height:1.7}.reveal-next{position:relative;margin-top:24px}@keyframes fracture-hit{0%{transform:scale(.05) rotate(-35deg);opacity:0;filter:brightness(5)}12%{opacity:1}32%{transform:scale(1.35) rotate(8deg);opacity:1;filter:brightness(2.8)}65%{transform:scale(1.8) rotate(-4deg);opacity:.85}100%{transform:scale(2.15) rotate(0);opacity:0;filter:brightness(1)}}@keyframes reveal-pop{0%{transform:scale(.25) rotate(-8deg);opacity:0}45%{transform:scale(1.12) rotate(2deg);opacity:1}70%{transform:scale(.96) rotate(-1deg)}100%{transform:scale(1) rotate(0);opacity:1}}@keyframes stamp-hit{0%{transform:scale(3.8) rotate(-25deg);opacity:0;filter:brightness(4)}48%{transform:scale(.78) rotate(8deg);opacity:1;filter:brightness(2)}75%{transform:scale(1.18) rotate(-3deg);filter:brightness(1.3)}100%{transform:scale(1) rotate(0);filter:brightness(1)}}@keyframes burst-spin{0%{transform:scale(.08) rotate(-30deg);opacity:0}24%{opacity:1}100%{transform:scale(1.2) rotate(32deg);opacity:0}}@keyframes shockwave{0%{transform:translate(-50%,-50%) e-content:center;text-align:center;padding:24px}.empty p{color:#94a3b8;line-height:1.7}

<body>
<header class="topbar"><div class="lefthead"><div class="brand">AI <span>VERSUS</span></div><div class="status"><strong id="match-counter">MATCH 1 / 3</strong> &nbsp;|&nbsp; 더 할루시네이션에 취약한 질문을 선택하세요</div></div><button class="edit-btn" id="open-editor"><i data-lucide="edit-3"></i>질문 & 사진 편집</button></header>

<section class="reveal-modal" id="reveal-modal" aria-live="assertive"><div class="fracture-overlay"></div><div class="reveal-card"><div class="reveal-burst"></div><div class="reveal-stamp" id="reveal-stamp">✓</div><div class="reveal-kicker">AI VERSUS · RESULT</div><div class="reveal-title" id="reveal-title">정답!</div><div class="reveal-detail" id="reveal-detail"></div><button class="primary reveal-next" id="show-explanation">해설 확인하기 <i data-lucide="arrow-right"></i></button></div></section>
<section class="modal" id="explanation-modal" role="dialog" aria-modal="true"><div class="dialog"><div class="dialog-head"><div><h3>할루시네이션 취약점 분석 해설</h3><div class="sub" id="selected-label"></div></div><button class="icon-btn" id="close-explanation" aria-label="닫기"><i data-lucide="x"></i></button></div><div class="explanation" id="explanation-text"></div><div class="actions"><button class="primary" id="next-btn">다음 라운드 <i data-lucide="arrow-right"></i></button></div></div></section>
<section class="drawer-wrap" id="editor-drawer"><div class="drawer"><div class="drawer-top"><h2><i data-lucide="sliders"></i> 질문 & 사진 커스텀 에디터</h2><button class="icon-btn" id="close-editor"><i data-lucide="x"></i></button></div><div class="drawer-intro"><span>질문, 사진, 프롬프트와 분석 해설을 수정할 수 있습니다.</span><button class="primary" id="add-match"><i data-lucide="plus"></i> 새 매치 추가</button></div><div id="editor-list"></div><p class="note">편집 내용은 현재 사용 중인 브라우저에만 저장됩니다. 공개된 기본 질문은 다른 방문자에게 영향을 주지 않습니다. 큰 사진 파일은 저장 공간을 많이 사용할 수 있습니다.</p></div></section>
<script>
const DEFAULT_PAIRS=[
{id:"1",correctOption:"A",optionA:{title:"학원 시간표 확인 요청",image:"https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=1200&q=80",prompt:'"내가 다니는 학원의 고2 수학 심화반 이번 주 시간표를 요일, 수업 시간, 강의실, 보강 일정까지 정확하게 알려줘."'},optionB:{title:"인강 커리큘럼 확인 요청",image:"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80",prompt:'"공식 강좌 페이지에 공개된 온라인 수학 강좌의 커리큘럼을 단원별 학습 순서와 함께 정리해줘."' },explanation:"<b>이 대결에서는 학원 시간표를 묻는 질문이 더 부정확한 답변을 유도할 가능성이 큽니다.</b><p>학원 시간표는 학원 지점, 반, 담당 강사, 수강생별 보강 여부에 따라 달라질 수 있고, 변경 사항이 외부에 공개되지 않는 경우도 많습니다. AI가 해당 학원의 최신 내부 정보를 확인할 수 없다면 요일이나 수업 시간, 강의실, 보강 일정을 그럴듯하게 추측해 답할 위험이 있습니다.</p><p>반면 온라인 강좌의 커리큘럼은 공식 강좌 소개 페이지에 공개되어 있는 경우가 많아, 해당 자료를 확인할 수 있다면 비교적 근거 있는 답변을 만들기 쉽습니다.</p><p><b>따라서 의도한 비교 결과는 OPTION A(학원 시간표)가 더 취약하다는 것입니다.</b> 단, 인강 커리큘럼도 최신 공지나 강좌 개편을 확인하지 않으면 틀릴 수 있으며, 실제 시간표는 학원 공지나 담당자에게 확인해야 합니다.</p>"},
{id:"2",correctOption:"A",optionA:{title:"수학 난제의 증명 요청",image:"https://images.unsplash.com/photo-1635070041078-e363dbe005cb?auto=format&fit=crop&w=1200&q=80",prompt:'"리만 가설이 참임을 엄밀하게 증명하고, 각 단계의 논리적 근거를 설명해줘."' },optionB:{title:"영어 문장 해석 요청",image:"https://images.unsplash.com/photo-1434030216411-0b793f4b4173?auto=format&fit=crop&w=1200&q=80",prompt:'"Although the plan seemed promising, its success depended on factors beyond our control. 이 문장을 자연스럽게 해석하고 문법 구조를 설명해줘."' },explanation:"<b>이 대결에서는 수학 난제의 증명 요청이 훨씬 더 어려운 과제입니다.</b><p>리만 가설은 현대 수학의 대표적인 미해결 문제입니다. 아직 일반적으로 인정된 증명이 없기 때문에 AI가 완전한 증명을 제시한다고 주장한다면 논리적 비약이나 잘못된 추론이 포함되어 있는지 매우 엄격하게 검증해야 합니다.</p><p>반면 제시된 영어 문장은 문맥과 문법을 바탕으로 의미를 해석할 수 있는 일반적인 독해 과제입니다. 여러 번역이 가능하더라도 근거를 비교하고 자연스러운 표현을 고를 수 있습니다.</p><p><b>따라서 OPTION A인 수학 난제 증명이 더 어렵습니다.</b> 여기서 어려움은 단순 계산량이 아니라, 아직 해결되지 않은 문제에 대해 참된 증명을 만들어야 한다는 점에 있습니다."},
{id:"3",correctOption:"A",optionA:{title:"법률 해석 및 판례 적용",image:"https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=1200&q=80",prompt:'"계약 해지 분쟁에서 관련 법률 조항과 판례를 검토하고, 주어진 사실관계에 어떤 요건이 적용되는지 근거와 함께 분석해줘."' },optionB:{title:"오늘의 날씨 확인",image:"https://images.unsplash.com/photo-1534088568595-a066f410bcda?auto=format&fit=crop&w=1200&q=80",prompt:'"서울의 오늘 날씨와 기온, 강수 가능성을 간단히 알려줘."' },explanation:"<b>이 대결에서는 법률 해석과 판례 적용이 더 어려운 과제입니다.</b><p>법률 문제는 관할 국가와 적용 시점, 구체적인 사실관계, 법 조항의 요건, 관련 판례의 취지를 함께 검토해야 합니다. 사실관계가 조금만 달라져도 결론이 바뀔 수 있고, 존재하지 않는 조항이나 판례를 만들어 내는 오류도 특히 주의해야 합니다.</p><p>반면 날씨는 위치와 날짜가 명확하고 신뢰할 수 있는 최신 기상 자료에 접근할 수 있다면 비교적 정형화된 정보를 전달하는 과제입니다.</p><p><b>따라서 OPTION A인 법률 분석이 더 어렵습니다.</b> 다만 실제 법률 판단은 AI의 답변만으로 결정하지 말고 공식 법령·판례와 전문가의 확인을 거쳐야 합니다."}
];
const STORAGE_KEY="ai_versus_personal_pairs_v6";
let pairs=loadPairs(),current=0;
function clone(v){return JSON.parse(JSON.stringify(v))}
function loadPairs(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY));return Array.isArray(v)?v:clone(DEFAULT_PAIRS)}catch{return clone(DEFAULT_PAIRS)}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(pairs))}catch{alert("저장 공간이 부족합니다. 사진 크기를 줄이거나 이미지 URL을 이용해주세요.")}}
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){const arena=$("arena");if(!pairs.length){$("match-counter").textContent="MATCH 0 / 0";arena.innerHTML='<div class="empty"><h2>등록된 질문 매치가 없습니다.</h2><p>질문 & 사진 편집에서 새 매치를 추가하세요.</p><button class="primary" onclick="openEditor()">질문 등록하기</button></div>';return}current=Math.min(current,pairs.length-1);$("match-counter").textContent=`MATCH ${current+1} / ${pairs.length}`;const p=pairs[current];arena.innerHTML=half(p.optionA,"A")+half(p.optionB,"B");arena.querySelectorAll("[data-choice]").forEach(b=>b.addEventListener("click",()=>choose(b.dataset.choice)));icons()}
function half(o,k){return `<button class="half ${k==="A"?"a":"b"}" data-choice="${k}" aria-label="옵션 ${k} 선택"><img src="${esc(o.image||"")}" alt="" onerror="this.onerror=null;this.src='https://placehold.co/1200x900/0f172a/00eaff?text=No+Image'"><span class="opt-badge">OPTION ${k}</span><span class="copy"><h2>${esc(o.title)}</h2><span class="prompt"><b>PROMPT:</b>${esc(o.prompt)}</span><span class="pick">클릭하여 이 질문 선택 <i data-lucide="chevron-right"></i></span></span></button>`}
function choose(k){const p=pairs[current],o=k==="A"?p.optionA:p.optionB,correct=p.correctOption||"A",isCorrect=k===correct;$("selected-label").textContent=`선택한 질문: OPTION ${k} (${o.title})`;$("explanation-text").innerHTML=p.explanation||"등록된 분석 해설이 없습니다.";$("next-btn").innerHTML=current===pairs.length-1?'모든 대결 완료 / 처음으로 <i data-lucide="check-circle"></i>':'다음 라운드 대결 <i data-lucide="arrow-right"></i>';$("reveal-modal").className="reveal-modal open "+(isCorrect?"correct":"wrong");$("reveal-stamp").textContent=isCorrect?"✓":"!";$("reveal-title").textContent=isCorrect?"정답!":"아쉬워요!";$("reveal-detail").textContent=isCorrect?"정확하게 골랐어요. 분석 해설을 확인해 보세요.":`정답은 OPTION ${correct}입니다. 어떤 점이 달랐는지 해설을 확인해 보세요.`;icons()}
function next(){ $("explanation-modal").classList.remove("open");if(current<pairs.length-1)current++;else{current=0;alert("모든 AI 할루시네이션 질문 대결을 완주했습니다.")}render()}
function icons(){if(window.lucide)lucide.createIcons()}
function openEditor(){renderEditors();$("editor-drawer").classList.add("open");icons()}
function closeEditor(){$("editor-drawer").classList.remove("open");render()}
function renderEditors(){const list=$("editor-list");if(!pairs.length){list.innerHTML='<p class="note">매치가 비어 있습니다. 새 매치를 추가하세요.</p>';return}list.innerHTML=pairs.map((p,i)=>`<section class="pair-editor" data-id="${esc(p.id)}"><div class="pair-title"><span class="pill">MATCH #${i+1}</span><button class="danger" data-delete="${esc(p.id)}">삭제</button></div><div class="forms">${editorOption(p,"A",p.optionA)}${editorOption(p,"B",p.optionB)}</div><label class="explain-label">할루시네이션 분석 해설</label><textarea data-field="explanation">${esc(p.explanation||"")}</textarea></section>`).join("");list.querySelectorAll("[data-delete]").forEach(b=>b.addEventListener("click",()=>{pairs=pairs.filter(p=>p.id!==b.dataset.delete);current=Math.min(current,Math.max(0,pairs.length-1));save();renderEditors()}));list.querySelectorAll("[data-field]").forEach(el=>el.addEventListener("change",()=>{const p=pairs.find(x=>x.id===el.closest(".pair-editor").dataset.id);p.explanation=el.value;save()}));list.querySelectorAll("[data-opt-field]").forEach(el=>el.addEventListener("change",()=>{const p=pairs.find(x=>x.id===el.closest(".pair-editor").dataset.id),o=el.dataset.option==="A"?p.optionA:p.optionB;o[el.dataset.optField]=el.value;save()}));list.querySelectorAll("[data-file]").forEach(el=>el.addEventListener("change",()=>upload(el)))}
function editorOption(p,k,o){return `<div class="option-form"><h4 style="color:${k==="A"?"#00eaff":"#c4a5ff"}">OPTION ${k}</h4><label>제목</label><input data-opt-field="title" data-option="${k}" value="${esc(o.title)}"><label>사진 URL</label><input data-opt-field="image" data-option="${k}" value="${esc(o.image)}" placeholder="https://..."><label>또는 사진 파일 (1.5MB 이하)</label><input type="file" accept="image/*" data-file data-option="${k}"><label>프롬프트 문구</label><textarea data-opt-field="prompt" data-option="${k}">${esc(o.prompt)}</textarea></div>`}
function upload(input){const f=input.files?.[0];if(!f)return;if(f.size>1500000){alert("사진 파일은 1.5MB 이하로 선택해주세요. 더 큰 사진은 URL을 사용해주세요.");input.value="";return}const p=pairs.find(x=>x.id===input.closest(".pair-editor").dataset.id),o=input.dataset.option==="A"?p.optionA:p.optionB,r=new FileReader();r.onload=()=>{o.image=r.result;save();renderEditors()};r.readAsDataURL(f)}
function addMatch(){pairs.push({id:crypto.randomUUID?.()||String(Date.now()),optionA:{title:"새 질문 A",image:"https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80",prompt:"질문 A 프롬프트 입력"},optionB:{title:"새 질문 B",image:"https://images.unsplash.com/photo-1620712943543-bcc4688e7485?auto=format&fit=crop&w=1200&q=80",prompt:"질문 B 프롬프트 입력"},explanation:"두 질문의 취약점과 판단 근거를 작성해주세요."});save();renderEditors()}
$("open-editor").addEventListener("click",openEditor);$("close-editor").addEventListener("click",closeEditor);$("add-match").addEventListener("click",addMatch);$("next-btn").addEventListener("click",next);$("show-explanation").addEventListener("click",()=>{$("reveal-modal").className="reveal-modal";$("explanation-modal").classList.add("open");icons()});$("close-explanation").addEventListener("click",()=>$("explanation-modal").classList.remove("open"));$("explanation-modal").addEventListener("click",e=>{if(e.target===$("explanation-modal"))$("explanation-modal").classList.remove("open")});$("editor-drawer").addEventListener("click",e=>{if(e.target===$("editor-drawer"))closeEditor()});document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("explanation-modal").classList.remove("open");closeEditor()}});
render();icons();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
</body></html>
